{% extends 'base.html' %}
{% load static %}
{% block title %}Task{% endblock %}

{% block content %}
    <div class="container">
        <div class="card shadow" id="studentForm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0" id="student-title">Student Registration Form</h4>
    </div>
    <div class="card-body">

      <form id="stu_register_Form">
        {% csrf_token %}

        <!-- student list -->
        <div class="mb-3">
            <input type="hidden" class="form-control" id="st_id" name="st_id">
            <label for="fname">First Name</label>
            <input type="text" class="form-control" id="fname" name="fname" required>
            <div id="empty-fname"></div>
        </div>

        <!-- last name -->
        <div class="mb-3">
            <label for="lname">Last Name</label>
                <input type="text" class="form-control" id="lname" name="lname" required>
                <div id="empty-lname"></div>
        </div>

        <!-- email -->
         <div class="mb-3">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
            <div id="empty-email"></div>
            <div id="emailHelp" class="form-text"></div>
        </div>

        <!-- language -->
        <div class="mb-3">
           
            <label for="lang" class="form-label">Language</label>
                <select class="form-select" name="lang" id="lang" required>
                     <option value=" "></option>
                    {% for value, label in languages %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
                <div id="empty-lang"></div>
        </div>

        <!-- city -->
        <div class="mb-3">
            <label for="city" class="form-label">City</label>
                <select class="form-select" name="city" id="city" required>
                 <option value=" "></option>
                    {% for value, label in cities %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
                <div id="empty-city"></div>
        </div>
        <br>
            <!-- gender -->
         <div class="mb-3">
                <input class="form-check-input" type="radio" name="gender" id="maleCheckbox" value="male" >
                 <label for="maleCheckbox">Male</label>
                <input class="form-check-input" type="radio" name="gender" id="femaleCheckbox" value="female" >
                <label for="femaleCheckbox">Female</label>

                 <!-- <label for="displayValue">Selected Gender:</label> -->
                <hidden input type="text" id="displayValue" readonly>
                <div id="empty-gender"></div>
        </div>
        <br>

        <!-- contact -->
            <div class="mb-3">
                <label for="contact">Contact</label>
                <input type="text" class="form-control" id="contact" name="contact" required>
                <div id="contact-pattern"></div>
            </div>

        <!-- <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" id="checkbox" for="exampleCheck1">Check me out</label>
        </div> -->
        
        <div id="acknowledge" class="mt-3 fw-semibold" style="display:none;"></div>
        <button type="submit" id="btn-create" class="btn btn-success w-100">Submit</button>
        <!-- <button type="submit" class="btn btn-success w-100" id="add_marks_btn">Add</button> -->
      </form>
    </div>
  </div>

  <button type="button"  id="hide_stu" class="btn btn-primary btn-lg">Close Form</button>
  <button type="button"  id="show_stu" class="btn btn-primary btn-lg">Register</button>


        <br>
        <!-- message -->
         <div id="message"></div>
        <br>

         <!-- table display -->
          
          <table id="data_table" class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <td>First Name</td>
                    <td>Last Name</td>
                    <td>Email Id</td>
                    <td>Gender</td>
                    <td>City</td>
                    <td>Language</td>
                    <td>Contact</td>
                    <td>Edit</td>
                    <td>Delete</td>
                </tr>
            </thead>
            <tbody id="studentList">
                {% include 'partials/student_row.html' %}
            </tbody>
           
          </table>


          <!-- <div id="studentDetails"></div> -->



    </div>
{% endblock %}
